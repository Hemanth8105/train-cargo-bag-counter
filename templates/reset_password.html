{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
<div style="width:100%;max-width:420px">
  <div style="text-align:center;margin-bottom:28px">
    <i class="fas fa-shield-alt" style="font-size:2.5rem;color:var(--green)"></i>
    <h1 style="margin-top:10px;font-size:1.4rem">Reset Password</h1>
    <p style="color:var(--muted);font-size:.875rem;margin-top:4px">Set your new password</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}"><i class="fas fa-info-circle"></i> {{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input name="password" type="password" class="form-control"
               placeholder="Min 6 characters" required autofocus/>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input name="confirm" type="password" class="form-control" required/>
      </div>
      <button type="submit" class="btn btn-green" style="width:100%;padding:12px;font-size:.95rem">
        <i class="fas fa-check"></i> Reset Password
      </button>
    </form>
  </div>
</div>
</div>
{% endblock %}
