{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="main" style="max-width:480px">
  <div class="page-header">
    <h1><i class="fas fa-key" style="color:var(--orange)"></i> Change Password</h1>
    <p>Update your account password.</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}"><i class="fas fa-info-circle"></i> {{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Current Password</label>
        <input name="current_password" type="password" class="form-control" required autofocus/>
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input name="new_password" type="password" class="form-control"
               placeholder="Min 6 characters" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input name="confirm_password" type="password" class="form-control" required/>
      </div>
      <div style="display:flex;gap:10px">
        <button type="submit" class="btn btn-orange"><i class="fas fa-key"></i> Change Password</button>
        <a href="/dashboard" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
